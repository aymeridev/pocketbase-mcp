name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: Start PocketBase
        run: scripts/test-pocketbase.sh
      - name: Integration tests
        run: npm run test:integration
        env:
          PB_TEST_URL: http://127.0.0.1:8090
          PB_TEST_EMAIL: admin@example.com
          PB_TEST_PASSWORD: password123456
